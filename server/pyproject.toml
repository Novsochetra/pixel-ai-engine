[project]
name = "pixel-server"
version = "0.3.0"
description = "The API of the pixel engine dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pixel-dataset",
  "uvicorn>=0.30",
]

[tool.uv.sources]
pixel-dataset = { path = "../dataset", editable = true }

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[project.scripts]
pixel-server = "pixel_server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "PLR0912", "PLR0913", "PLR0915", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_server"]
