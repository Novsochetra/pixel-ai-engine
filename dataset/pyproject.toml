[project]
name = "pixel-dataset"
version = "0.2.0"
description = "Gathers, cleans and shows the datasets for the pixel art engine"
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=0.26",
  "pillow>=10",
  "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pixel = "pixel_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_data"]
