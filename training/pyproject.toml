[project]
name = "pixel-training"
version = "0.2.1"
description = "Tries, trains and evaluates the models of the pixel art engine"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10",
]

[project.optional-dependencies]
models = [
  "accelerate>=1.16",
  "diffusers>=0.43",
  "ftfy>=6",
  "gguf>=0.10",
  "huggingface_hub>=0.26",
  "peft>=0.17",
  "protobuf>=5",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "torch>=2.6",
  "transformers>=5.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pixel-train = "pixel_training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_training"]
